name: pd-guard Release Gate
on: [push, pull_request]
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install numpy pillow pytest torch --index-url https://download.pytorch.org/whl/cpu || pip install numpy pillow pytest
      - run: python -m pytest tests/test_pd_guard.py -q
      - run: python scripts/pd_guard_r3.py dieline --spec examples/gable_top/spec.json --allow-missing-strip
      - run: python scripts/pd_guard_data.py leakage --index output/zoo_t1/index.jsonl || true
